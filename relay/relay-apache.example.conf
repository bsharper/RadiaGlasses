# Put this inside the existing HTTPS virtual host for your domain.
# For example:
#   /etc/apache2/sites-available/example-ssl.conf
#
# Do not put it in a second <VirtualHost *:443> with the same ServerName,
# because Apache will route a domain to the first matching vhost.

ProxyPreserveHost On
ProxyPass "/bridge/" "http://127.0.0.1:8791/bridge/" retry=0 timeout=3600
ProxyPassReverse "/bridge/" "http://127.0.0.1:8791/bridge/"

RewriteEngine On
RewriteCond %{REQUEST_URI} ^/bridge$
RewriteRule ^(.*)$ /bridge/ [R=301,L]

# Required modules:
#   a2enmod proxy proxy_http rewrite
#
# Run relay with:
#   PORT=8791 BASE_PATH=/bridge npm run relay
